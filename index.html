    <script>
      (function() {
        // Suppress unhandled WebSocket rejections/errors from Vite HMR client in iframe
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || String(e))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });

        // Intercept Vite HMR WebSocket connections to prevent closure errors
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          function ViteHmrWebSocket(url, protocols) {
            var isHmr = false;
            try {
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                isHmr = true;
              } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
                isHmr = true;
              }
            } catch (err) {}

            if (!isHmr) {
              return new OrigWS(url, protocols);
            }

            var listeners = {};
            var self = {
              url: url,
              protocol: 'vite-hmr',
              readyState: 1,
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
              },
              dispatchEvent: function(event) {
                var handler = self['on' + event.type];
                if (typeof handler === 'function') {
                  try { handler.call(self, event); } catch (e) {}
                }
                var list = listeners[event.type] || [];
                list.forEach(function(l) {
                  try { l.call(self, event); } catch (e) {}
                });
                return true;
              },
              send: function() {},
              close: function() {
                self.readyState = 3;
                self.dispatchEvent(new Event('close'));
              }
            };

            setTimeout(function() {
              self.dispatchEvent(new Event('open'));
            }, 0);

            return self;
          }

          ViteHmrWebSocket.prototype = OrigWS.prototype;
          ViteHmrWebSocket.CONNECTING = 0;
          ViteHmrWebSocket.OPEN = 1;
          ViteHmrWebSocket.CLOSING = 2;
          ViteHmrWebSocket.CLOSED = 3;
          window.WebSocket = ViteHmrWebSocket;
        }
      })();
    </script>
